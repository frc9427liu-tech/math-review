<p class="sub">評量卷 2–7｜實數與不等式、絕對值、乘法公式、根式與算幾、指數律。點題目展開解法。</p>

const main=document.getElementById('main');
let html='';
for(const c of D){
  html+=`<section id="${c.id}"><h2>${c.title}　<small style="color:var(--mute);font-weight:400">${c.score}</small></h2><p class="core">${c.core}</p><div class="formula">${c.formula}</div>`;
  for(const q of c.qs){
    const tag=q.bad?`<span class="tag bad">${q.mark?'扣 '+q.mark.replace('-','')+' 分':'被扣分'}</span>`:(q.bad===false?`<span class="tag ok">答對</span>`:'');
    html+=`<details class="q" data-bad="${q.bad?1:0}"><summary><span class="num">${q.n}</span><span class="stmt">${q.s}</span>${tag}</summary><div class="body"><div class="ans">答案：<span>${q.a}</span></div><ol>${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${q.pit?`<div class="pit"><b>${q.bad?'容易錯的地方':'備註'}</b>　${q.pit}</div>`:''}${q.tryq?`<div class="try">試試看：${q.tryq}<button onclick="this.nextElementSibling.style.display='block';this.remove()">看答案</button><div class="a">${q.tryA}</div></div>`:''}</div></details>`;
  }
  html+='</section>';
}
main.innerHTML=html;

const total=document.querySelectorAll('.q').length,bad=document.querySelectorAll('.q[data-bad="1"]').length;
document.getElementById('stats').textContent=`共 ${total} 題，被扣分 ${bad} 題`;
document.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.toggle('on',x===b));
  const onlyBad=b.dataset.f==='bad';
  document.querySelectorAll('.q').forEach(q=>q.classList.toggle('hide',onlyBad&&q.dataset.bad!=='1'));
});
let open=false;
document.getElementById('expand').onclick=e=>{open=!open;document.querySelectorAll('.q').forEach(q=>q.open=open);e.target.textContent=open?'全部收合':'全部展開';};
